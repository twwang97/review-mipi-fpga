<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-label="TIDA-010083 power tree" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#F6F8FA}
  .t{font-family:'IBM Plex Sans','Inter','Helvetica Neue',Arial,sans-serif;fill:#16202A}
  .m{font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .title{font-size:22px;font-weight:600}
  .sub{font-size:12.5px;fill:#5A6B78}
  .blk{font-size:13.5px;font-weight:600}
  .blk2{font-size:12px;font-weight:600}
  .pn{font-size:10.5px;fill:#61727E}
  .lbl{font-size:10.5px;fill:#41525E}
  .rail{font-size:15px;font-weight:600}
  .wire{fill:none;stroke-width:2.2}
</style>
<defs>
  <marker id="p1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#A6402F"/></marker>
  <marker id="p2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B5742A"/></marker>
  <marker id="p3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1E7A5C"/></marker>
  <marker id="p4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2A6C93"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1280" height="700"/>
<text class="t title" x="34" y="44">Power tree</text>
<text class="t sub" x="34" y="66">Two prioritised inputs → one isolated 5 V rail → two point-of-load rails for the PHY. Every conversion stage and its setting resistor is shown.</text>

<line x1="592" y1="96" x2="592" y2="612" stroke="#A6402F" stroke-width="2" stroke-dasharray="9 6"/>
<text class="t" x="592" y="112" font-size="11" font-weight="600" fill="#A6402F" text-anchor="middle">functional isolation</text>

<!-- inputs -->
<rect x="34" y="150" width="176" height="92" fill="#FCF1EF" stroke="#C0806F" rx="4"/>
<text class="t blk" x="122" y="176" text-anchor="middle">PoE input</text>
<text class="t pn" x="122" y="196" text-anchor="middle">via RJ45 centre taps</text>
<text class="m" x="122" y="216" text-anchor="middle" font-size="13" fill="#A6402F">36 – 57 V</text>
<text class="t pn" x="122" y="233" text-anchor="middle">Class 0 · PD draws ≤ 12.95 W</text>

<rect x="34" y="286" width="176" height="92" fill="#FDF6EC" stroke="#C9A570" rx="4"/>
<text class="t blk" x="122" y="312" text-anchor="middle">Auxiliary input</text>
<text class="t pn" x="122" y="332" text-anchor="middle">J4 pin, barrel or M8</text>
<text class="m" x="122" y="352" text-anchor="middle" font-size="13" fill="#B5742A">18 – 36 V</text>
<text class="t pn" x="122" y="369" text-anchor="middle">24 V nominal · takes priority</text>

<!-- conditioning -->
<rect x="248" y="150" width="150" height="92" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
<text class="t blk2" x="323" y="174" text-anchor="middle">Rectifier bridges</text>
<text class="t pn" x="323" y="192" text-anchor="middle">D6 / D7 CDBHD2100-G</text>
<text class="t pn" x="323" y="209" text-anchor="middle">polarity and pair</text>
<text class="t pn" x="323" y="224" text-anchor="middle">independent</text>
<text class="t pn" x="323" y="238" text-anchor="middle">→ significant heat source</text>

<rect x="248" y="286" width="150" height="92" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
<text class="t blk2" x="323" y="310" text-anchor="middle">Ideal diode ORing</text>
<text class="t pn" x="323" y="328" text-anchor="middle">LM74700-Q1</text>
<text class="t pn" x="323" y="344" text-anchor="middle">+ CSD19538Q2 (100 V)</text>
<text class="t pn" x="323" y="362" text-anchor="middle">20 mV forward drop</text>
<text class="t pn" x="323" y="376" text-anchor="middle">−65 V reverse rated</text>

<!-- PD + flyback primary -->
<rect x="436" y="176" width="140" height="216" fill="#FCF1EF" stroke="#C0806F" rx="4"/>
<text class="t blk" x="506" y="202" text-anchor="middle">TPS23758</text>
<text class="t pn" x="506" y="222" text-anchor="middle">PD interface</text>
<text class="t pn" x="506" y="238" text-anchor="middle">100 V hot-swap FET</text>
<text class="t pn" x="506" y="256" text-anchor="middle">150 V / 0.77 Ω PWM FET</text>
<line x1="450" y1="270" x2="562" y2="270" stroke="#D8BDB5"/>
<text class="t pn" x="506" y="288" text-anchor="middle">R20 24.9 kΩ signature</text>
<text class="t pn" x="506" y="304" text-anchor="middle">R29 649 Ω → Class 0</text>
<text class="t pn" x="506" y="320" text-anchor="middle">R18∥R19 0.455 Ω</text>
<text class="t pn" x="506" y="334" text-anchor="middle">→ 1.3 A peak limit</text>
<text class="t pn" x="506" y="352" text-anchor="middle">R17/R21 → aux at ≈15 V</text>
<text class="t pn" x="506" y="370" text-anchor="middle">FRS, DTHR: SSFD on</text>
<text class="t pn" x="506" y="386" text-anchor="middle">SST C49 1 µF soft-start</text>

<!-- transformer -->
<rect x="612" y="220" width="116" height="128" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
<text class="t blk2" x="670" y="244" text-anchor="middle">T3 flyback</text>
<text class="t pn" x="670" y="262" text-anchor="middle">750318525</text>
<text class="t pn" x="670" y="278" text-anchor="middle">6 : 1 : 2.66</text>
<text class="t pn" x="670" y="294" text-anchor="middle">L_P = 150 µH</text>
<text class="t pn" x="670" y="312" text-anchor="middle">aux winding →</text>
<text class="t pn" x="670" y="326" text-anchor="middle">primary-side feedback</text>
<text class="t pn" x="670" y="342" text-anchor="middle">no opto, no TL431</text>

<rect x="612" y="374" width="116" height="60" fill="#EFF8F3" stroke="#84B9A2" rx="4"/>
<text class="t blk2" x="670" y="394" text-anchor="middle">Sync rectifier</text>
<text class="t pn" x="670" y="410" text-anchor="middle">Q1 CSD17579Q3A</text>
<text class="t pn" x="670" y="426" text-anchor="middle">winding-driven gate</text>

<!-- 5V node -->
<rect x="770" y="252" width="150" height="96" fill="#EFF8F3" stroke="#3E9A77" rx="4"/>
<text class="t rail" x="845" y="280" text-anchor="middle" fill="#1E7A5C">+5 V</text>
<text class="t pn" x="845" y="300" text-anchor="middle">R26 200 k / R35 36.5 k</text>
<text class="t pn" x="845" y="316" text-anchor="middle">→ V_AUX 11.3 V → 5.02 V</text>
<text class="t pn" x="845" y="334" text-anchor="middle">±2 %, ≤ 2.3 A, ≤ 92 %</text>

<!-- PoLs -->
<rect x="966" y="168" width="176" height="80" fill="#EFF4F8" stroke="#6E9CB8" rx="4"/>
<text class="t blk2" x="1054" y="190" text-anchor="middle">TPS62801YKAR</text>
<text class="t pn" x="1054" y="207" text-anchor="middle">R36 23.7 kΩ (R2D set)</text>
<text class="t pn" x="1054" y="223" text-anchor="middle">L1 470 nH · 4 MHz · WCSP-6</text>
<text class="t pn" x="1054" y="239" text-anchor="middle">R10 0 Ω isolates V_IN for test</text>

<rect x="966" y="300" width="176" height="80" fill="#EFF4F8" stroke="#6E9CB8" rx="4"/>
<text class="t blk2" x="1054" y="322" text-anchor="middle">TPS62802YKAR</text>
<text class="t pn" x="1054" y="339" text-anchor="middle">R39 44.2 kΩ (R2D set)</text>
<text class="t pn" x="1054" y="355" text-anchor="middle">L2 470 nH · 4 MHz · WCSP-6</text>
<text class="t pn" x="1054" y="371" text-anchor="middle">R42 0 Ω bridges +2V5 → +VIO</text>

<!-- loads -->
<rect x="1176" y="168" width="76" height="80" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
<text class="t rail" x="1214" y="196" text-anchor="middle" fill="#2A6C93">1.0 V</text>
<text class="t pn" x="1214" y="216" text-anchor="middle">VDD1P0</text>
<text class="t pn" x="1214" y="232" text-anchor="middle">≈108 mA</text>

<rect x="1176" y="300" width="76" height="80" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
<text class="t rail" x="1214" y="328" text-anchor="middle" fill="#2A6C93">2.5 V</text>
<text class="t pn" x="1214" y="348" text-anchor="middle">VDDA2P5</text>
<text class="t pn" x="1214" y="362" text-anchor="middle">+VDDIO</text>
<text class="t pn" x="1214" y="376" text-anchor="middle">≈137+24 mA</text>

<rect x="966" y="410" width="286" height="94" fill="#FFFDF5" stroke="#CBBE8E" rx="4"/>
<text class="t blk2" x="1109" y="432" text-anchor="middle">VDDA1P8 — made inside the PHY</text>
<text class="t pn" x="1109" y="452" text-anchor="middle">This board runs in two-supply mode.</text><text class="t pn" x="1109" y="468" text-anchor="middle">An external 1.8 V rail would cut</text>
<text class="t pn" x="1109" y="484" text-anchor="middle">495 mW to 457 mW, at the cost of</text><text class="t pn" x="1109" y="500" text-anchor="middle">a rail and a sequencing rule.</text>

<rect x="770" y="424" width="150" height="66" fill="#EFF8F3" stroke="#84B9A2" rx="4"/>
<text class="t blk2" x="845" y="446" text-anchor="middle">To host board</text>
<text class="t pn" x="845" y="463" text-anchor="middle">+5 V via system connector</text>
<text class="t pn" x="845" y="479" text-anchor="middle">≈11 W after PHY subsystem</text>

<!-- wires -->
<path class="wire" d="M210,196 H248" stroke="#A6402F" marker-end="url(#p1)"/>
<path class="wire" d="M398,196 H436" stroke="#A6402F" marker-end="url(#p1)"/>
<path class="wire" d="M210,332 H248" stroke="#B5742A" marker-end="url(#p2)"/>
<path class="wire" d="M398,332 H416 V300 H436" stroke="#B5742A" fill="none" marker-end="url(#p2)"/>
<path class="wire" d="M576,284 H612" stroke="#A6402F" marker-end="url(#p1)"/>
<path class="wire" d="M670,348 V374" stroke="#1E7A5C" marker-end="url(#p3)"/>
<path class="wire" d="M728,284 H770" stroke="#1E7A5C" marker-end="url(#p3)"/>
<path class="wire" d="M920,284 H944 V208 H966" stroke="#1E7A5C" fill="none" marker-end="url(#p3)"/>
<path class="wire" d="M920,300 H944 V340 H966" stroke="#1E7A5C" fill="none" marker-end="url(#p3)"/>
<path class="wire" d="M845,348 V424" stroke="#1E7A5C" marker-end="url(#p3)"/>
<path class="wire" d="M1142,208 H1176" stroke="#2A6C93" marker-end="url(#p4)"/>
<path class="wire" d="M1142,340 H1176" stroke="#2A6C93" marker-end="url(#p4)"/>

<text class="m" x="592" y="276" font-size="10" fill="#A6402F" text-anchor="middle">V_PD</text>
<text class="t lbl" x="748" y="276">18–57 V in</text>

<!-- budget strip -->
<rect x="34" y="520" width="1218" height="132" fill="#FFFFFF" stroke="#DCE4E9" rx="5"/>
<text class="t blk" x="50" y="544">Power budget, PoE source, worst case</text>
<text class="t lbl" x="50" y="568">PSE allocates 15.4 W at its port for Class 0. The PD may draw 12.95 W at V_PD. At 90 % flyback efficiency this leaves ≈11.6 W on the 5 V rail.</text>
<text class="t lbl" x="50" y="588">Deduct the PHY subsystem: DP83867 495 mW in two-supply mode, plus point-of-load losses ≈ 550 mW drawn from +5 V.</text>
<text class="t lbl" x="50" y="608">Available to the host FPGA / camera board: <tspan font-weight="600" fill="#1E7A5C">≈11.0 W (≈2.2 A at 5 V)</tspan>. On the auxiliary input, derate: at 18 V the primary RMS current and duty cycle are worst-case.</text>
<text class="t lbl" x="50" y="632">Thermal note: at 18 V in / 1.6 A out the hot spots are the TPS23758 and its sense resistors; on PoE the rectifier bridges become a second hot spot. No fan, no heatsink — 27 × 27 mm of copper is the only path.</text>
</svg>
