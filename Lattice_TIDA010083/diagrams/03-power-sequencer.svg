<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" width="1300" height="800" role="img" aria-label="TIDA-010083 power-up sequence" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#F6F8FA}
  .t{font-family:'IBM Plex Sans','Inter','Helvetica Neue',Arial,sans-serif;fill:#16202A}
  .m{font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .title{font-size:22px;font-weight:600}
  .sub{font-size:12.5px;fill:#5A6B78}
  .ph{font-size:12px;font-weight:600;fill:#2D3C47}
  .pn{font-size:10.5px;fill:#61727E}
  .lbl{font-size:10.5px;fill:#41525E}
  .lane{font-size:11.5px;font-weight:600}
  .w{fill:none;stroke-width:2.4}
</style>
<rect class="bg" x="0" y="0" width="1300" height="800"/>
<text class="t title" x="34" y="44">Power sequencer</text>
<text class="t sub" x="34" y="66">There is no sequencer IC. The order is enforced by the PSE handshake, then by the TPS23758 hot-swap and soft-start, then by the PHY's own power-on reset. Time axis is not to scale.</text>

<!-- phase columns -->
<g>
  <rect x="216" y="92" width="150" height="640" fill="#FFFFFF" stroke="#E2E8EC"/>
  <rect x="366" y="92" width="140" height="640" fill="#FAFCFD" stroke="#E2E8EC"/>
  <rect x="506" y="92" width="120" height="640" fill="#FFFFFF" stroke="#E2E8EC"/>
  <rect x="626" y="92" width="130" height="640" fill="#FAFCFD" stroke="#E2E8EC"/>
  <rect x="756" y="92" width="150" height="640" fill="#FFFFFF" stroke="#E2E8EC"/>
  <rect x="906" y="92" width="150" height="640" fill="#FAFCFD" stroke="#E2E8EC"/>
  <rect x="1056" y="92" width="210" height="640" fill="#FFFFFF" stroke="#E2E8EC"/>
</g>
<text class="t ph" x="291" y="112" text-anchor="middle">1 · Detection</text>
<text class="t pn" x="291" y="128" text-anchor="middle">V_PD 2.7 – 10.1 V</text>
<text class="t ph" x="436" y="112" text-anchor="middle">2 · Classification</text>
<text class="t pn" x="436" y="128" text-anchor="middle">V_PD 14.5 – 20.5 V</text>
<text class="t ph" x="566" y="112" text-anchor="middle">3 · Mark / ramp</text>
<text class="t pn" x="566" y="128" text-anchor="middle">PSE turns on</text>
<text class="t ph" x="691" y="112" text-anchor="middle">4 · Inrush</text>
<text class="t pn" x="691" y="128" text-anchor="middle">36 – 42 V window</text>
<text class="t ph" x="831" y="112" text-anchor="middle">5 · Converter start</text>
<text class="t pn" x="831" y="128" text-anchor="middle">soft-start via SST</text>
<text class="t ph" x="981" y="112" text-anchor="middle">6 · Rails up</text>
<text class="t pn" x="981" y="128" text-anchor="middle">1.0 V and 2.5 V</text>
<text class="t ph" x="1161" y="112" text-anchor="middle">7 · PHY initialisation</text>
<text class="t pn" x="1161" y="128" text-anchor="middle">POR, straps, MDIO</text>

<line x1="216" y1="144" x2="1266" y2="144" stroke="#C3D0D8"/>

<!-- V_PD analog lane -->
<text class="t lane" x="34" y="176">V_PD (PSE voltage)</text>
<text class="t pn" x="34" y="192">measured at the PD input</text>
<line x1="216" y1="270" x2="1266" y2="270" stroke="#DCE4E9"/>
<text class="t pn" x="200" y="274" text-anchor="end">0 V</text>
<text class="t pn" x="200" y="222" text-anchor="end">~20 V</text>
<text class="t pn" x="200" y="178" text-anchor="end">~48 V</text>
<path class="w" d="M216,270 L236,258 L256,270 L276,254 L296,270 L316,250 L336,270 L356,262
                   L366,226 L406,226 L446,230 L486,226 L506,262 L566,262
                   L626,196 L646,174 L1266,174" stroke="#A6402F"/>
<text class="t pn" x="291" y="292" text-anchor="middle">4-step resistance probe</text>
<text class="t pn" x="291" y="306" text-anchor="middle">R20 24.9 kΩ presented</text>
<text class="t pn" x="291" y="320" text-anchor="middle">valid window 19 – 26.5 kΩ</text>
<text class="t pn" x="436" y="292" text-anchor="middle">PD sinks 1.8 – 2.4 mA</text>
<text class="t pn" x="436" y="306" text-anchor="middle">via R29 = 649 Ω</text>
<text class="t pn" x="436" y="320" text-anchor="middle">→ Class 0 → 15.4 W</text>
<text class="t pn" x="691" y="292" text-anchor="middle">UVLO releases</text>
<text class="t pn" x="691" y="306" text-anchor="middle">≈35.5 V rising</text>
<text class="t pn" x="691" y="320" text-anchor="middle">≈31 V falling</text>

<line x1="216" y1="340" x2="1266" y2="340" stroke="#C3D0D8"/>

<!-- digital lanes -->
<g>
  <!-- lane template positions -->
  <text class="t lane" x="34" y="372">Hot-swap MOSFET</text>
  <text class="t pn" x="34" y="387">inside TPS23758</text>
  <line x1="216" y1="380" x2="626" y2="380" stroke="#B9C6CE" stroke-width="2"/>
  <path class="w" d="M626,380 L646,356 L1266,356" stroke="#A6402F"/>
  <text class="t pn" x="360" y="374">open — no current reaches the converter</text>
  <text class="t pn" x="700" y="348">closed, inrush-limited</text>

  <text class="t lane" x="34" y="432">Converter enable</text>
  <text class="t pn" x="34" y="447">SST pin, C49 1 µF</text>
  <line x1="216" y1="440" x2="756" y2="440" stroke="#B9C6CE" stroke-width="2"/>
  <path class="w" d="M756,440 L790,416 L1266,416" stroke="#A6402F"/>
  <text class="t pn" x="800" y="408">PWM runs, peak current ramps to the 1.3 A limit</text>

  <text class="t lane" x="34" y="492">+5 V (isolated)</text>
  <text class="t pn" x="34" y="507">flyback output</text>
  <line x1="216" y1="500" x2="790" y2="500" stroke="#B9C6CE" stroke-width="2"/>
  <path class="w" d="M790,500 C830,500 850,478 906,476 L1266,476" stroke="#1E7A5C"/>
  <text class="t pn" x="920" y="468">in regulation, ±2 %</text>

  <text class="t lane" x="34" y="552">+1.0 V</text>
  <text class="t pn" x="34" y="567">TPS62801</text>
  <line x1="216" y1="560" x2="920" y2="560" stroke="#B9C6CE" stroke-width="2"/>
  <path class="w" d="M920,560 C944,560 952,540 972,538 L1266,538" stroke="#2A6C93"/>

  <text class="t lane" x="34" y="606">+2.5 V / +VIO</text>
  <text class="t pn" x="34" y="621">TPS62802</text>
  <line x1="216" y1="614" x2="920" y2="614" stroke="#B9C6CE" stroke-width="2"/>
  <path class="w" d="M920,614 C944,614 952,594 972,592 L1266,592" stroke="#2A6C93"/>

  <text class="t lane" x="34" y="662">PHY state</text>
  <text class="t pn" x="34" y="677">DP83867IR</text>
  <line x1="216" y1="670" x2="1000" y2="670" stroke="#B9C6CE" stroke-width="2"/>
  <path class="w" d="M1000,670 L1010,648 L1266,648" stroke="#8C3A6B"/>
</g>

<!-- annotations on the right -->
<g>
  <line x1="1080" y1="636" x2="1080" y2="700" stroke="#8C3A6B" stroke-dasharray="4 3"/>
  <line x1="1150" y1="636" x2="1150" y2="716" stroke="#8C3A6B" stroke-dasharray="4 3"/>
  <line x1="1240" y1="636" x2="1240" y2="700" stroke="#8C3A6B" stroke-dasharray="4 3"/>
  <text class="t pn" x="1080" y="690" text-anchor="middle">internal POR</text>
  <text class="t pn" x="1150" y="708" text-anchor="middle">straps latched</text>
  <text class="t pn" x="1120" y="722" text-anchor="middle">T2 ≤ 200 ms</text>
  <text class="t pn" x="1246" y="690" text-anchor="end">MDIO usable</text>
  <text class="t pn" x="1246" y="704" text-anchor="end">T1 ≥ 200 ms</text>
</g>

<!-- notes -->
<rect x="34" y="744" width="1232" height="42" fill="#FFFDF5" stroke="#CBBE8E" rx="4"/>
<text class="t lbl" x="48" y="763">Sequencing rules that matter · The DP83867 in two-supply mode (1.0 V + 2.5 V, 1.8 V generated internally) has <tspan font-weight="600">no supply ordering requirement</tspan>, which is why the two point-of-load converters here are simply enabled from +5 V.</text>
<text class="t lbl" x="48" y="778">Only three-supply mode adds a rule: VDDA1P8 must be stable within 25 ms of VDDA2P5 ramping, and on power-down the 1.8 V rail must fall before the 2.5 V rail. An auxiliary input above ≈15 V short-circuits phases 1–4 entirely.</text>
</svg>
