<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" width="1300" height="700" role="img" aria-label="Ethernet data path and PHY strapping" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#F6F8FA}
  .t{font-family:'IBM Plex Sans','Inter','Helvetica Neue',Arial,sans-serif;fill:#16202A}
  .m{font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .title{font-size:22px;font-weight:600}
  .sub{font-size:12.5px;fill:#5A6B78}
  .blk{font-size:13px;font-weight:600}
  .blk2{font-size:11.5px;font-weight:600}
  .pn{font-size:10.5px;fill:#61727E}
  .lbl{font-size:10.5px;fill:#41525E}
  .w{fill:none;stroke-width:2}
  .grp{font-size:11.5px;font-weight:600;fill:#3A4A55}
</style>
<defs>
  <marker id="dA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#384C99"/></marker>
  <marker id="dB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8C3A6B"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1300" height="700"/>
<text class="t title" x="34" y="44">Ethernet data path and PHY configuration</text>
<text class="t sub" x="34" y="66">Left to right: twisted pair to media-dependent interface to RGMII. Below: the strapping that decides what the PHY is before any software runs.</text>

<!-- data path chain -->
<g>
  <rect x="34" y="102" width="140" height="110" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
  <text class="t blk2" x="104" y="126" text-anchor="middle">CAT5e / CAT6</text>
  <text class="t pn" x="104" y="144" text-anchor="middle">4 pairs, up to 130 m</text>
  <text class="t pn" x="104" y="162" text-anchor="middle">PAM-5, 17 level</text>
  <text class="t pn" x="104" y="178" text-anchor="middle">125 Msymbol/s per pair</text>
  <text class="t pn" x="104" y="196" text-anchor="middle">tested error-free at 150 m</text>

  <rect x="214" y="102" width="150" height="110" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
  <text class="t blk2" x="289" y="126" text-anchor="middle">Transformer + tap</text>
  <text class="t pn" x="289" y="144" text-anchor="middle">4 isolated channels</text>
  <text class="t pn" x="289" y="162" text-anchor="middle">cable-side taps feed the PD</text>
  <text class="t pn" x="289" y="180" text-anchor="middle">PHY-side taps to GND via C</text>
  <text class="t pn" x="289" y="198" text-anchor="middle">R44 1 MΩ ∥ C54 for EMI</text>

  <rect x="404" y="102" width="150" height="110" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
  <text class="t blk2" x="479" y="126" text-anchor="middle">MDI</text>
  <text class="t pn" x="479" y="146" text-anchor="middle">100 Ω differential</text>
  <text class="t pn" x="479" y="164" text-anchor="middle">intra-pair length matched</text>
  <text class="t pn" x="479" y="182" text-anchor="middle">pairs need no matching</text>
  <text class="t pn" x="479" y="200" text-anchor="middle">to each other</text>

  <rect x="594" y="92" width="266" height="130" fill="#F4F6FC" stroke="#8E9BC6" rx="4"/>
  <text class="t blk" x="727" y="116" text-anchor="middle">PMD → PMA → PCS</text>
  <text class="t pn" x="727" y="136" text-anchor="middle">echo and crosstalk cancellation, equalisation,</text>
  <text class="t pn" x="727" y="152" text-anchor="middle">baseline wander correction, skew compensation</text>
  <text class="t pn" x="727" y="170" text-anchor="middle">auto-negotiation · auto-MDIX · leader/follower</text>
  <text class="t pn" x="727" y="188" text-anchor="middle">1000BASE-T / 100BASE-TX / 10BASE-Te blocks</text>
  <text class="t pn" x="727" y="208" text-anchor="middle">TDR cable diagnostics, ±1 m accuracy</text>

  <rect x="900" y="102" width="160" height="110" fill="#F4F6FC" stroke="#8E9BC6" rx="4"/>
  <text class="t blk2" x="980" y="126" text-anchor="middle">RGMII interface</text>
  <text class="t pn" x="980" y="146" text-anchor="middle">4-bit DDR, both edges</text>
  <text class="t pn" x="980" y="164" text-anchor="middle">12 pins instead of GMII's 24</text>
  <text class="t pn" x="980" y="182" text-anchor="middle">TX_ER folded into TX_CTRL</text>
  <text class="t pn" x="980" y="200" text-anchor="middle">RX_ER folded into RX_CTRL</text>

  <rect x="1100" y="102" width="166" height="110" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
  <text class="t blk2" x="1183" y="126" text-anchor="middle">MAC in the FPGA</text>
  <text class="m pn" x="1183" y="148" text-anchor="middle">GTX_CLK, TX_CTRL, TXD[3:0]</text>
  <text class="m pn" x="1183" y="166" text-anchor="middle">RX_CLK, RX_CTRL, RXD[3:0]</text>
  <text class="t pn" x="1183" y="186" text-anchor="middle">latency budget TX 88 ns</text>
  <text class="t pn" x="1183" y="202" text-anchor="middle">RX 288 ns at 1000BASE-T</text>

  <path class="w" d="M174,157 H214" stroke="#384C99" marker-end="url(#dA)"/>
  <path class="w" d="M364,157 H404" stroke="#384C99" marker-end="url(#dA)"/>
  <path class="w" d="M554,157 H594" stroke="#384C99" marker-end="url(#dA)"/>
  <path class="w" d="M860,157 H900" stroke="#384C99" marker-end="url(#dA)"/>
  <path class="w" d="M1060,140 H1100" stroke="#384C99" marker-end="url(#dA)"/>
  <path class="w" d="M1100,178 H1060" stroke="#384C99" marker-end="url(#dA)"/>
</g>

<text class="t grp" x="34" y="262">Reverse loopback — how the board is validated without a MAC</text>
<rect x="34" y="274" width="600" height="86" fill="#FFFDF5" stroke="#CBBE8E" rx="4"/>
<text class="t lbl" x="50" y="296">Write BISCR 0x0016 = 0x0020 and the PHY returns every frame it receives on the MDI back down</text>
<text class="t lbl" x="50" y="313">the wire. A PC can then exercise the RJ45, the magnetics and the whole analogue front end with no</text>
<text class="t lbl" x="50" y="330">host board attached. TI validated this at 1 TB of traffic per condition, with and without PoE load,</text>
<text class="t lbl" x="50" y="347">on 20 cm and 150 m of CAT6 — zero frame errors in every case.</text>

<text class="t grp" x="666" y="262">MDIO management</text>
<rect x="666" y="274" width="600" height="86" fill="#FFFFFF" stroke="#DCE4E9" rx="4"/>
<text class="t lbl" x="682" y="296">Clause 22 direct access reaches registers 0x00–0x1F. Everything above that — RGMII delay, I/O</text>
<text class="t lbl" x="682" y="313">configuration, Wake-on-LAN, SFD — lives in the extended space and needs the MMD indirect method</text>
<text class="t lbl" x="682" y="330">through REGCR 0x0D and ADDAR 0x0E with DEVAD = 0x1F. Four transactions per extended register,</text>
<text class="t lbl" x="682" y="347">or use the post-increment modes when writing a block.</text>

<!-- strapping -->
<text class="t grp" x="34" y="400">Four-level strapping — set before the first instruction executes</text>
<rect x="34" y="412" width="1232" height="266" fill="#FFFFFF" stroke="#DCE4E9" rx="5"/>

<rect x="54" y="432" width="290" height="226" fill="#FAFCFD" stroke="#D3DDE3" rx="4"/>
<text class="t blk2" x="199" y="454" text-anchor="middle">How a 4-level strap works</text>
<text class="t pn" x="70" y="476">Each strap pin has a 9 kΩ ±25 % internal pull-down.</text>
<text class="t pn" x="70" y="492">An external divider sets one of four voltage bands,</text>
<text class="t pn" x="70" y="508">sampled at power-up or hardware reset:</text>
<text class="m pn" x="80" y="532">mode 1   R_hi open, R_lo open      → 0 V</text>
<text class="m pn" x="80" y="550">mode 2   10 kΩ / 2.49 kΩ           → 0.165 × VDDIO</text>
<text class="m pn" x="80" y="568">mode 3   5.76 kΩ / 2.49 kΩ         → 0.255 × VDDIO</text>
<text class="m pn" x="80" y="586">mode 4   2.49 kΩ / open            → 0.783 × VDDIO</text>
<text class="t pn" x="70" y="612" fill="#A6402F">Strap pins must never be tied straight to VDD or GND —</text>
<text class="t pn" x="70" y="627" fill="#A6402F">they become functional outputs after reset releases.</text>
<text class="t pn" x="70" y="648">Use 1 % resistors.</text>

<rect x="364" y="432" width="440" height="226" fill="#FAFCFD" stroke="#D3DDE3" rx="4"/>
<text class="t blk2" x="584" y="454" text-anchor="middle">What is strapped on the TIDA-010083 board</text>
<text class="m pn" x="382" y="480">RX_CTRL   R23 6.04 kΩ / R43 2.49 kΩ → mode 3</text>
<text class="t pn" x="394" y="496">Auto-negotiation enabled. Modes 1 and 2 are illegal on this pin.</text>
<text class="m pn" x="382" y="520">LED_0     open            → mode 1, mirror disabled</text>
<text class="m pn" x="382" y="538">LED_1     open            → mode 1, ANEG_SEL = 0</text>
<text class="m pn" x="382" y="556">LED_2     open            → mode 1</text>
<text class="t pn" x="394" y="574">R27 and R30 are fitted as do-not-populate footprints, so the</text>
<text class="t pn" x="394" y="589">options are there if you want them.</text>
<rect x="382" y="602" width="404" height="46" fill="#FBEDE9" stroke="#D2A398" rx="3"/>
<text class="t pn" x="394" y="620" fill="#A6402F">The schematic states plainly: “further strapping done on other board”.</text>
<text class="t pn" x="394" y="636" fill="#A6402F">PHY address and RGMII clock skew straps are your carrier's job.</text>

<rect x="824" y="432" width="422" height="226" fill="#FAFCFD" stroke="#D3DDE3" rx="4"/>
<text class="t blk2" x="1035" y="454" text-anchor="middle">LED pins are strap pins — mind the polarity flip</text>
<text class="t pn" x="842" y="478">A strap resistively pulled <tspan font-style="italic">low</tspan> (modes 1, 2, 3) configures that pin as an</text>
<text class="t pn" x="842" y="494">active-high driver. Pulled <tspan font-style="italic">high</tspan> (mode 4) makes it active-low. So the LED</text>
<text class="t pn" x="842" y="510">must be wired to GND or to VDD depending on the strap you chose, or it</text>
<text class="t pn" x="842" y="526">will simply never light.</text>
<text class="t pn" x="842" y="550">On this board: D9/D10/D11 with 3.32 kΩ series resistors, referenced to +VIO.</text>
<rect x="842" y="566" width="386" height="76" fill="#FFFDF5" stroke="#CBBE8E" rx="3"/>
<text class="t pn" x="854" y="586">Drop VDDIO to 1.8 V to save power and the LEDs go dim — most</text>
<text class="t pn" x="854" y="602">need more than 1.8 V of forward voltage. The fix is an open-</text>
<text class="t pn" x="854" y="618">collector level shifter at the LED output running from 2.5 V or</text>
<text class="t pn" x="854" y="634">3.3 V, or a low-threshold FET. Decide this before fixing VDDIO.</text>
</svg>
