<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" role="img" aria-label="Bandwidth budget from sensor to Ethernet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#F6F8FA}
  .t{font-family:'IBM Plex Sans','Inter','Helvetica Neue',Arial,sans-serif;fill:#16202A}
  .m{font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .title{font-size:22px;font-weight:600}
  .sub{font-size:12.5px;fill:#5A6B78}
  .blk{font-size:13px;font-weight:600}
  .blk2{font-size:11.5px;font-weight:600}
  .pn{font-size:10.5px;fill:#61727E}
  .lbl{font-size:10.5px;fill:#41525E}
  .big{font-size:20px;font-weight:600}
  .w{fill:none;stroke-width:2.4}
</style>
<defs>
  <marker id="bA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B3FA0"/></marker>
  <marker id="bB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#384C99"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1300" height="720"/>
<text class="t title" x="34" y="44">Bandwidth budget — where the real constraint sits</text>
<text class="t sub" x="34" y="66">The camera and the FPGA are both comfortable. Gigabit Ethernet is the wall, and it is the reason the FPGA needs an external frame buffer rather than a FIFO.</text>

<!-- stage 1 -->
<rect x="34" y="100" width="290" height="180" fill="#F7F1FA" stroke="#B896CC" rx="5"/>
<text class="t blk" x="179" y="126" text-anchor="middle">Sensor output</text>
<text class="t big" x="179" y="164" text-anchor="middle" fill="#6B3FA0">2.76 Gb/s</text>
<text class="t pn" x="179" y="188" text-anchor="middle">1920 × 1200 × 10 bit × 120 fps</text>
<line x1="60" y1="204" x2="298" y2="204" stroke="#D9C6E6"/>
<text class="t pn" x="179" y="224" text-anchor="middle">Spread over 4 CSI-2 lanes:</text>
<text class="m pn" x="179" y="242" text-anchor="middle">≈ 691 Mb/s per lane payload</text>
<text class="m pn" x="179" y="258" text-anchor="middle">≈ 750 Mb/s with CSI-2 overhead</text>
<text class="t pn" x="179" y="274" text-anchor="middle">Sensor pixel clock caps at 90 MHz</text>

<!-- stage 2 -->
<rect x="376" y="100" width="290" height="180" fill="#F7F1FA" stroke="#B896CC" rx="5"/>
<text class="t blk" x="521" y="126" text-anchor="middle">FPGA D-PHY capacity</text>
<text class="t big" x="521" y="164" text-anchor="middle" fill="#6B3FA0">10 Gb/s</text>
<text class="t pn" x="521" y="188" text-anchor="middle">hardened quad, 2.5 Gb/s per lane</text>
<line x1="402" y1="204" x2="640" y2="204" stroke="#D9C6E6"/>
<text class="t pn" x="521" y="226" text-anchor="middle">Utilisation at the worst case:</text>
<text class="t big" x="521" y="256" text-anchor="middle" fill="#1E7A5C">30 %</text>
<text class="t pn" x="521" y="274" text-anchor="middle">Room for a second sensor on the other quad</text>

<!-- stage 3 -->
<rect x="718" y="100" width="290" height="180" fill="#F4F6FC" stroke="#8E9BC6" rx="5"/>
<text class="t blk" x="863" y="126" text-anchor="middle">Ethernet payload</text>
<text class="t big" x="863" y="164" text-anchor="middle" fill="#A6402F">≈ 0.95 Gb/s</text>
<text class="t pn" x="863" y="188" text-anchor="middle">1000BASE-T line rate 1 Gb/s</text>
<line x1="744" y1="204" x2="982" y2="204" stroke="#C4CCE4"/>
<text class="t pn" x="863" y="224" text-anchor="middle">After Ethernet, IP, UDP and GVSP headers,</text>
<text class="t pn" x="863" y="240" text-anchor="middle">FCS, preamble and inter-frame gap.</text>
<text class="t pn" x="863" y="260" text-anchor="middle">Jumbo frames (9000 B MTU) are what get you</text>
<text class="t pn" x="863" y="276" text-anchor="middle">to 95 %. A 1500 B MTU costs about 3 % more.</text>

<!-- verdict -->
<rect x="1060" y="100" width="206" height="180" fill="#FBEDE9" stroke="#D2A398" rx="5"/>
<text class="t blk" x="1163" y="126" text-anchor="middle" fill="#A6402F">Rate mismatch</text>
<text class="t big" x="1163" y="166" text-anchor="middle" fill="#A6402F">2.9 : 1</text>
<text class="t pn" x="1163" y="192" text-anchor="middle">The sensor produces nearly three</text>
<text class="t pn" x="1163" y="208" text-anchor="middle">times what the cable can carry.</text>
<text class="t pn" x="1163" y="232" text-anchor="middle">This is not a defect of either part —</text>
<text class="t pn" x="1163" y="248" text-anchor="middle">it is the design problem the FPGA</text>
<text class="t pn" x="1163" y="264" text-anchor="middle">exists to solve.</text>

<path class="w" d="M324,190 H376" stroke="#6B3FA0" marker-end="url(#bA)"/>
<path class="w" d="M666,190 H718" stroke="#6B3FA0" marker-end="url(#bB)"/>
<path class="w" d="M1008,190 H1060" stroke="#384C99" marker-end="url(#bB)"/>

<!-- table -->
<rect x="34" y="308" width="700" height="290" fill="#FFFFFF" stroke="#DCE4E9" rx="5"/>
<text class="t blk" x="52" y="334">Sustained frame rate over the wire</text>
<line x1="52" y1="348" x2="716" y2="348" stroke="#C3D0D8"/>
<text class="t blk2" x="60" y="368">Mode</text>
<text class="t blk2" x="310" y="368">Bits per frame</text>
<text class="t blk2" x="470" y="368">Wire limit</text>
<text class="t blk2" x="600" y="368">Actual</text>
<line x1="52" y1="378" x2="716" y2="378" stroke="#C3D0D8"/>

<text class="t lbl" x="60" y="400">1920 × 1200 Mono8, full frame</text>
<text class="m lbl" x="310" y="400">18.43 Mb</text>
<text class="m lbl" x="470" y="400">51 fps</text>
<text class="m lbl" x="600" y="400" fill="#A6402F">51 fps</text>
<line x1="52" y1="412" x2="716" y2="412" stroke="#EDF1F4"/>

<text class="t lbl" x="60" y="434">1920 × 1200 Mono10 packed</text>
<text class="m lbl" x="310" y="434">23.04 Mb</text>
<text class="m lbl" x="470" y="434">41 fps</text>
<text class="m lbl" x="600" y="434" fill="#A6402F">41 fps</text>
<line x1="52" y1="446" x2="716" y2="446" stroke="#EDF1F4"/>

<text class="t lbl" x="60" y="468">1920 × 1200 debayered RGB8</text>
<text class="m lbl" x="310" y="468">55.30 Mb</text>
<text class="m lbl" x="470" y="468">17 fps</text>
<text class="m lbl" x="600" y="468" fill="#A6402F">17 fps</text>
<line x1="52" y1="480" x2="716" y2="480" stroke="#EDF1F4"/>

<text class="t lbl" x="60" y="502">1280 × 720 Mono8, region of interest</text>
<text class="m lbl" x="310" y="502">7.37 Mb</text>
<text class="m lbl" x="470" y="502">128 fps</text>
<text class="m lbl" x="600" y="502" fill="#1E7A5C">120 fps</text>
<line x1="52" y1="514" x2="716" y2="514" stroke="#EDF1F4"/>

<text class="t lbl" x="60" y="536">960 × 600 Mono8, 2 × 2 binned</text>
<text class="m lbl" x="310" y="536">4.61 Mb</text>
<text class="m lbl" x="470" y="536">205 fps</text>
<text class="m lbl" x="600" y="536" fill="#1E7A5C">120 fps</text>
<line x1="52" y1="548" x2="716" y2="548" stroke="#C3D0D8"/>
<text class="t lbl" x="60" y="570" fill="#1E7A5C">Green = the sensor is the limit, the link has headroom.</text>
<text class="t lbl" x="60" y="586" fill="#A6402F">Red = the link is the limit, and frames must be dropped, cropped, binned or buffered.</text>

<!-- mitigations -->
<rect x="758" y="308" width="508" height="290" fill="#FFFFFF" stroke="#DCE4E9" rx="5"/>
<text class="t blk" x="776" y="334">What the FPGA has to do about it</text>

<text class="t blk2" x="776" y="362">Region of interest and binning, in the sensor</text>
<text class="t lbl" x="776" y="380">The AR0234CS supports configurable window size, blanking, digital binning</text>
<text class="t lbl" x="776" y="396">and skipping. Cropping at the sensor beats cropping in the FPGA — it cuts</text>
<text class="t lbl" x="776" y="412">MIPI traffic, FPGA power and buffer pressure all at once.</text>

<text class="t blk2" x="776" y="442">Elastic frame buffer, in DDR3L</text>
<text class="t lbl" x="776" y="460">A full Mono8 frame is 2.30 MB. The LIFCL-40 carries 2.9 Mb (≈363 KB) of</text>
<text class="t lbl" x="776" y="476">on-chip memory — roughly a sixth of one frame. Burst-mode capture at</text>
<text class="t lbl" x="776" y="492">120 fps followed by a slower drain therefore needs external DRAM. A 1 Gb</text>
<text class="t lbl" x="776" y="508">x16 DDR3L part holds ~54 Mono8 frames; the x16 DQS support is built in.</text>

<text class="t blk2" x="776" y="538">Flow control and back-pressure</text>
<text class="t lbl" x="776" y="556">Advertise pause capability during auto-negotiation and honour incoming</text>
<text class="t lbl" x="776" y="572">pause frames. A GigE Vision receiver that falls behind will use them, and a</text>
<text class="t lbl" x="776" y="588">camera that ignores them turns congestion into dropped frames.</text>

<!-- footer -->
<rect x="34" y="626" width="1232" height="76" fill="#FFFDF5" stroke="#CBBE8E" rx="5"/>
<text class="t blk2" x="50" y="648">The honest summary of this pairing</text>
<text class="t lbl" x="50" y="668">A 120 fps global-shutter sensor behind a gigabit link is deliberately oversubscribed. You buy the 120 fps for short triggered bursts and for small regions of interest — reading a</text>
<text class="t lbl" x="50" y="684">barcode on a moving belt, catching a part mid-flight — not for continuous full-frame streaming. If continuous full-frame 120 fps is the requirement, the honest answer is that</text>
<text class="t lbl" x="50" y="700">TIDA-010083 is the wrong front end and the design needs 2.5GBASE-T or 10GBASE-T, at which point the PoE power budget and the thermal envelope both change too.</text>
</svg>
