<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 860" width="1300" height="860" role="img" aria-label="TIDA-010083 reset sequencer and timing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#F6F8FA}
  .t{font-family:'IBM Plex Sans','Inter','Helvetica Neue',Arial,sans-serif;fill:#16202A}
  .m{font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .title{font-size:22px;font-weight:600}
  .sub{font-size:12.5px;fill:#5A6B78}
  .blk{font-size:13px;font-weight:600}
  .blk2{font-size:11.5px;font-weight:600}
  .pn{font-size:10.5px;fill:#61727E}
  .lbl{font-size:10.5px;fill:#41525E}
  .sig{font-size:11px;font-weight:600}
  .w{fill:none;stroke-width:2.2}
  .tm{font-size:10.5px;font-weight:600;fill:#8C3A6B}
</style>
<defs>
  <marker id="mL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#8C3A6B"/></marker>
  <marker id="mR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8C3A6B"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1300" height="860"/>
<text class="t title" x="34" y="44">Reset sequencer</text>
<text class="t sub" x="34" y="66">The DP83867 self-releases from an internal power-on reset, so RESET_N is optional. What is not optional is respecting the strap-latch and register-access windows before the host touches MDIO.</text>

<!-- Panel A -->
<rect x="34" y="92" width="600" height="440" fill="#FFFFFF" stroke="#DCE4E9" rx="5"/>
<text class="t blk" x="52" y="118">A · Cold power-up (no external reset)</text>
<text class="t pn" x="52" y="136">This is what happens on the TIDA-010083 every time PoE comes up.</text>

<g>
  <text class="t sig" x="52" y="176">VDD rails</text>
  <path class="w" d="M180,190 C210,190 216,164 250,162 L614,162" stroke="#2A6C93"/>
  <line x1="180" y1="190" x2="180" y2="190" stroke="#2A6C93"/>
  <line x1="120" y1="190" x2="180" y2="190" stroke="#B9C6CE" stroke-width="2"/>

  <text class="t sig" x="52" y="226">XI clock</text>
  <line x1="120" y1="228" x2="262" y2="228" stroke="#B9C6CE" stroke-width="2"/>
  <path class="w" d="M262,228 L262,212 L272,212 L272,228 L282,228 L282,212 L292,212 L292,228 L302,228 L302,212 L312,212 L312,228 L322,228 L322,212 L332,212 L332,228 L342,228 L342,212 L352,212 L352,228 L362,228 L362,212 L372,212 L372,228 L382,228 L382,212 L392,212 L392,228 L614,228" stroke="#61761A" stroke-width="1.6"/>
  <text class="t pn" x="286" y="248">oscillator starts once VDDA1P8 is alive</text>

  <text class="t sig" x="52" y="286">RESET_N</text>
  <text class="t pn" x="52" y="300">internal pull-up</text>
  <line x1="120" y1="278" x2="614" y2="278" stroke="#8C3A6B" stroke-width="2.2"/>
  <text class="t pn" x="370" y="270" text-anchor="middle" fill="#8C3A6B">held high — never asserted by this board</text>

  <text class="t sig" x="52" y="346">Strap pins</text>
  <rect x="120" y="330" width="300" height="20" fill="#F4E9F0" stroke="#D5AFC6"/>
  <text class="t pn" x="270" y="344" text-anchor="middle">sampled as 4-level inputs</text>
  <rect x="420" y="330" width="194" height="20" fill="#EFF4F8" stroke="#8FB4CB"/>
  <text class="t pn" x="517" y="344" text-anchor="middle">re-purposed as LED / data outputs</text>
  <line x1="420" y1="322" x2="420" y2="360" stroke="#8C3A6B" stroke-dasharray="3 3"/>

  <text class="t sig" x="52" y="406">MDC</text>
  <text class="t pn" x="52" y="420">host access</text>
  <rect x="120" y="390" width="360" height="20" fill="#FBEDE9" stroke="#D2A398"/>
  <text class="t pn" x="300" y="404" text-anchor="middle" fill="#A6402F">host must stay off the bus</text>
  <rect x="480" y="390" width="134" height="20" fill="#EAF5EF" stroke="#84B9A2"/>
  <text class="t pn" x="547" y="404" text-anchor="middle" fill="#1E7A5C">registers readable</text>

  <line x1="180" y1="440" x2="180" y2="150" stroke="#C3D0D8" stroke-dasharray="3 3"/>
  <line x1="420" y1="452" x2="420" y2="326" stroke="#C3D0D8" stroke-dasharray="3 3"/>
  <line x1="480" y1="470" x2="480" y2="386" stroke="#C3D0D8" stroke-dasharray="3 3"/>

  <line x1="180" y1="452" x2="420" y2="452" stroke="#8C3A6B" marker-start="url(#mL)" marker-end="url(#mR)"/>
  <text class="t tm" x="300" y="446" text-anchor="middle">T2 ≤ 200 ms — hardware configuration latch-in</text>
  <line x1="180" y1="470" x2="480" y2="470" stroke="#8C3A6B" marker-start="url(#mL)" marker-end="url(#mR)"/>
  <text class="t tm" x="330" y="486" text-anchor="middle">T1 ≥ 200 ms — stabilisation before the first MDC preamble</text>
  <text class="t pn" x="52" y="508">T3 = 64 ns — dual-function pins hand over to their output drivers. MDIO must be</text>
  <text class="t pn" x="52" y="522">pulled high for the 32-bit serial management initialisation (2.2 kΩ, R3 on this board).</text>
</g>

<!-- Panel B -->
<rect x="666" y="92" width="600" height="440" fill="#FFFFFF" stroke="#DCE4E9" rx="5"/>
<text class="t blk" x="684" y="118">B · Hardware reset driven by the host FPGA</text>
<text class="t pn" x="684" y="136">Use this when the host needs a deterministic restart without a power cycle.</text>

<g>
  <text class="t sig" x="684" y="176">VDD rails</text>
  <line x1="812" y1="162" x2="1246" y2="162" stroke="#2A6C93" stroke-width="2.2"/>
  <text class="t pn" x="1030" y="154" text-anchor="middle">already stable</text>

  <text class="t sig" x="684" y="226">XI clock</text>
  <path class="w" d="M812,228 L812,212 L822,212 L822,228 L832,228 L832,212 L842,212 L842,228 L852,228 L852,212 L862,212 L862,228 L872,228 L872,212 L882,212 L882,228 L892,228 L892,212 L902,212 L902,228 L912,228 L912,212 L922,212 L922,228 L1246,228" stroke="#61761A" stroke-width="1.6"/>
  <text class="t pn" x="1000" y="248" fill="#A6402F">must be running for ≥ 1 µs while RESET_N is low</text>

  <text class="t sig" x="684" y="286">RESET_N</text>
  <path class="w" d="M812,268 L880,268 L880,296 L946,296 L946,268 L1246,268" stroke="#8C3A6B"/>
  <line x1="880" y1="312" x2="946" y2="312" stroke="#8C3A6B" marker-start="url(#mL)" marker-end="url(#mR)"/>
  <text class="t tm" x="913" y="326" text-anchor="middle">T4 ≥ 1 µs</text>

  <text class="t sig" x="684" y="346">Strap pins</text>
  <rect x="812" y="330" width="134" height="20" fill="#EFF4F8" stroke="#8FB4CB"/>
  <rect x="946" y="330" width="42" height="20" fill="#F4E9F0" stroke="#D5AFC6"/>
  <rect x="988" y="330" width="258" height="20" fill="#EFF4F8" stroke="#8FB4CB"/>
  <text class="t pn" x="1117" y="344" text-anchor="middle">outputs resume</text>
  <line x1="988" y1="322" x2="988" y2="368" stroke="#8C3A6B" stroke-dasharray="3 3"/>
  <line x1="946" y1="322" x2="946" y2="368" stroke="#8C3A6B" stroke-dasharray="3 3"/>
  <line x1="946" y1="368" x2="988" y2="368" stroke="#8C3A6B" marker-start="url(#mL)" marker-end="url(#mR)"/>
  <text class="t tm" x="1246" y="392" text-anchor="end">T2 = 120 ns re-latch · T3 = 64 ns to outputs</text>

  <text class="t sig" x="684" y="406">MDC</text>
  <rect x="946" y="390" width="150" height="20" fill="#FBEDE9" stroke="#D2A398"/>
  <text class="t pn" x="1021" y="404" text-anchor="middle" fill="#A6402F">wait</text>
  <rect x="1096" y="390" width="150" height="20" fill="#EAF5EF" stroke="#84B9A2"/>
  <text class="t pn" x="1171" y="404" text-anchor="middle" fill="#1E7A5C">registers readable</text>
  <line x1="946" y1="428" x2="1096" y2="428" stroke="#8C3A6B" marker-start="url(#mL)" marker-end="url(#mR)"/>
  <text class="t tm" x="1021" y="444" text-anchor="middle">T1 ≥ 195 µs</text>
  <text class="t pn" x="684" y="472">MDC may toggle during T1 provided MDIO is held high. Note the asymmetry:</text>
  <text class="t pn" x="684" y="488">195 µs after a hardware reset versus 200 ms after a cold power-up — three orders</text>
  <text class="t pn" x="684" y="504">of magnitude apart, and both easy to violate in a fast FPGA boot.</text>
  <text class="t pn" x="684" y="522" fill="#A6402F">A soft reset re-applies the strap values sampled at the last power-up or hard reset.</text>
</g>

<!-- reset mechanisms -->
<rect x="34" y="552" width="1232" height="288" fill="#FFFFFF" stroke="#DCE4E9" rx="5"/>
<text class="t blk" x="52" y="578">The four reset mechanisms, and what each one keeps</text>

<line x1="52" y1="592" x2="1248" y2="592" stroke="#C3D0D8"/>
<text class="t blk2" x="60" y="612">Mechanism</text>
<text class="t blk2" x="330" y="612">Trigger</text>
<text class="t blk2" x="640" y="612">Registers affected</text>
<text class="t blk2" x="960" y="612">Straps</text>
<line x1="52" y1="622" x2="1248" y2="622" stroke="#C3D0D8"/>

<g>
  <text class="t lbl" x="60" y="644" font-weight="600">Power-on reset</text>
  <text class="t lbl" x="330" y="644">automatic, internal</text>
  <text class="t lbl" x="640" y="644">all registers → defaults</text>
  <text class="t lbl" x="960" y="644">sampled fresh</text>

  <line x1="52" y1="656" x2="1248" y2="656" stroke="#EDF1F4"/>
  <text class="t lbl" x="60" y="678" font-weight="600">Hardware reset</text>
  <text class="m lbl" x="330" y="678">RESET_N low ≥ 1 µs</text>
  <text class="t lbl" x="640" y="678">all registers → defaults</text>
  <text class="t lbl" x="960" y="678">re-sampled from the pins</text>

  <line x1="52" y1="690" x2="1248" y2="690" stroke="#EDF1F4"/>
  <text class="t lbl" x="60" y="712" font-weight="600">IEEE software reset</text>
  <text class="m lbl" x="330" y="712">BMCR 0x0000 bit 15 = 1</text>
  <text class="t lbl" x="640" y="712">IEEE standard registers only</text>
  <text class="t lbl" x="960" y="712">re-applied from the last sample</text>

  <line x1="52" y1="724" x2="1248" y2="724" stroke="#EDF1F4"/>
  <text class="t lbl" x="60" y="746" font-weight="600">Global software reset</text>
  <text class="m lbl" x="330" y="746">CTRL 0x001F bit 15 = 1</text>
  <text class="t lbl" x="640" y="746">all internal circuits, IEEE + extended</text>
  <text class="t lbl" x="960" y="746">hardware config values maintained</text>

  <line x1="52" y1="758" x2="1248" y2="758" stroke="#EDF1F4"/>
  <text class="t lbl" x="60" y="780" font-weight="600">Global software restart</text>
  <text class="m lbl" x="330" y="780">CTRL 0x001F bit 14 = 1</text>
  <text class="t lbl" x="640" y="780">every circuit <tspan font-style="italic">except</tspan> the register file</text>
  <text class="t lbl" x="960" y="780">untouched — settings survive</text>
</g>
<line x1="52" y1="792" x2="1248" y2="792" stroke="#C3D0D8"/>
<text class="t lbl" x="60" y="814">The restart is the one to reach for after writing configuration that only takes effect on a link re-establishment — for example loading Sync FIFO Control 0x00E9 with 0xDF22 before relying on</text>
<text class="t lbl" x="60" y="830">1588 start-of-frame determinism. It re-initialises the datapath without throwing away the settings you just wrote.</text>
</svg>
