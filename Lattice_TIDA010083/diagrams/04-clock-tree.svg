<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" role="img" aria-label="TIDA-010083 clock tree" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#F6F8FA}
  .t{font-family:'IBM Plex Sans','Inter','Helvetica Neue',Arial,sans-serif;fill:#16202A}
  .m{font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .title{font-size:22px;font-weight:600}
  .sub{font-size:12.5px;fill:#5A6B78}
  .blk{font-size:13px;font-weight:600}
  .blk2{font-size:11.5px;font-weight:600}
  .pn{font-size:10.5px;fill:#61727E}
  .lbl{font-size:10.5px;fill:#41525E}
  .freq{font-size:12px;font-weight:600;fill:#4A5D12}
  .w{fill:none;stroke-width:2}
  .grp{font-size:11.5px;font-weight:600;fill:#3A4A55}
</style>
<defs>
  <marker id="ck" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#61761A"/></marker>
  <marker id="ckr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2A6C93"/></marker>
  <marker id="cko" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8C3A6B"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1300" height="760"/>
<text class="t title" x="34" y="44">Clock tree</text>
<text class="t sub" x="34" y="66">One 25 MHz reference feeds everything on the data side. The receive clock is recovered from the line, not generated locally — the two domains meet inside the PHY's elastic buffering.</text>

<text class="t grp" x="34" y="104">Reference sources</text>
<text class="t grp" x="452" y="104">DP83867IR internal clocking</text>
<text class="t grp" x="946" y="104">Destinations</text>

<!-- sources -->
<rect x="34" y="120" width="220" height="96" fill="#FFFDF5" stroke="#C2B47E" rx="4"/>
<text class="t blk" x="144" y="145" text-anchor="middle">25 MHz crystal</text>
<text class="t freq" x="144" y="167" text-anchor="middle">25.000 MHz ±50 ppm</text>
<text class="t pn" x="144" y="186" text-anchor="middle">across XI (pin 15) and XO (pin 14)</text>
<text class="t pn" x="144" y="202" text-anchor="middle">populated by default on this board</text>

<rect x="34" y="238" width="220" height="118" fill="#FFFFFF" stroke="#C3D0D8" rx="4"/>
<text class="t blk" x="144" y="262" text-anchor="middle">External oscillator option</text>
<text class="t pn" x="144" y="281" text-anchor="middle">remove the crystal, populate C62,</text>
<text class="t pn" x="144" y="296" text-anchor="middle">AC-couple a 25 MHz clock into XI</text>
<text class="t pn" x="144" y="315" text-anchor="middle">XO must then float</text>
<text class="t pn" x="144" y="333" text-anchor="middle" fill="#A6402F">XI wants 1.5–1.9 Vpp, absolute max 2.1 V</text>
<text class="t pn" x="144" y="348" text-anchor="middle" fill="#A6402F">a 2.5 V or 3.3 V source needs attenuation</text>

<rect x="34" y="380" width="220" height="90" fill="#FCF1EF" stroke="#C0806F" rx="4"/>
<text class="t blk2" x="144" y="402" text-anchor="middle">Converter clocks (separate domain)</text>
<text class="t pn" x="144" y="420" text-anchor="middle">TPS62801 / TPS62802: 4 MHz PWM</text>
<text class="t pn" x="144" y="436" text-anchor="middle">(1.5 MHz in the alternate mode)</text>
<text class="t pn" x="144" y="454" text-anchor="middle">TPS23758 flyback: set by FRS (R41 60.4 k)</text>
<text class="t pn" x="144" y="468" text-anchor="middle">and dithered by DTHR (R38 237 k)</text>

<!-- PHY internals -->
<rect x="404" y="120" width="500" height="400" fill="#FFFFFF" stroke="#8E9BC6" rx="5"/>
<text class="t blk" x="654" y="144" text-anchor="middle">DP83867IRRGZ</text>

<rect x="428" y="160" width="200" height="66" fill="#F7FAF0" stroke="#A9BC72" rx="4"/>
<text class="t blk2" x="528" y="182" text-anchor="middle">Local reference clock</text>
<text class="t pn" x="528" y="199" text-anchor="middle">central source for all device clocking</text>
<text class="t pn" x="528" y="215" text-anchor="middle">embedded into transmitted traffic</text>

<rect x="428" y="248" width="200" height="72" fill="#F7FAF0" stroke="#A9BC72" rx="4"/>
<text class="t blk2" x="528" y="270" text-anchor="middle">DAC / ADC timing block</text>
<text class="t pn" x="528" y="287" text-anchor="middle">TX symbol clock 125 Msym/s</text>
<text class="t pn" x="528" y="303" text-anchor="middle">PAM-5, 17-level, 4 pairs</text>

<rect x="428" y="342" width="200" height="86" fill="#EFF4F8" stroke="#6E9CB8" rx="4"/>
<text class="t blk2" x="528" y="364" text-anchor="middle">Clock recovery</text>
<text class="t pn" x="528" y="381" text-anchor="middle">RX clock extracted from the line,</text>
<text class="t pn" x="528" y="397" text-anchor="middle">locked to the link partner's TX clock</text>
<text class="t pn" x="528" y="415" text-anchor="middle">skew compensation across A/B/C/D</text>

<rect x="664" y="160" width="216" height="80" fill="#F4F6FC" stroke="#8E9BC6" rx="4"/>
<text class="t blk2" x="772" y="182" text-anchor="middle">RGMII delay control</text>
<text class="t pn" x="772" y="199" text-anchor="middle">Aligned mode or Shift mode</text>
<text class="t pn" x="772" y="215" text-anchor="middle">16 steps, 0.25 ns each, TX and RX</text>
<text class="t pn" x="772" y="231" text-anchor="middle">RGMIICTL 0x0032 · RGMIIDCTL 0x0086</text>

<rect x="664" y="258" width="216" height="72" fill="#F4F6FC" stroke="#8E9BC6" rx="4"/>
<text class="t blk2" x="772" y="280" text-anchor="middle">CLK_OUT mux</text>
<text class="t pn" x="772" y="297" text-anchor="middle">I/O Config register 0x0170</text>
<text class="t pn" x="772" y="313" text-anchor="middle">default = XI-synchronous; selectable to</text>
<text class="t pn" x="772" y="327" text-anchor="middle">recovered RX 125 MHz or ÷5 = 25 MHz</text>

<rect x="664" y="348" width="216" height="80" fill="#FFF7FB" stroke="#D5AFC6" rx="4"/>
<text class="t blk2" x="772" y="370" text-anchor="middle">Asynchronous clocks</text>
<text class="t pn" x="772" y="387" text-anchor="middle">MDC — up to 25 MHz, gapped, no minimum</text>
<text class="t pn" x="772" y="403" text-anchor="middle">JTAG_CLK — up to 2.5 MHz</text>
<text class="t pn" x="772" y="419" text-anchor="middle">neither is related to the 25 MHz reference</text>

<rect x="428" y="450" width="452" height="54" fill="#FAFCFD" stroke="#D3DDE3" rx="4"/>
<text class="t pn" x="654" y="470" text-anchor="middle">Speed scaling on the RGMII clocks — 1000 Mb/s: 125 MHz, Tcyc 8 ns, duty 45–55 %</text>
<text class="t pn" x="654" y="488" text-anchor="middle">100 Mb/s: 25 MHz (40 ns ±4 ns) · 10 Mb/s: 2.5 MHz (400 ns ±40 ns), duty 40–60 %</text>

<!-- destinations -->
<rect x="946" y="120" width="320" height="86" fill="#EFF4F8" stroke="#6E9CB8" rx="4"/>
<text class="t blk2" x="1106" y="142" text-anchor="middle">GTX_CLK — from the MAC into the PHY</text>
<text class="t freq" x="1106" y="163" text-anchor="middle">125 MHz, sourced by the FPGA</text>
<text class="t pn" x="1106" y="181" text-anchor="middle">continuous; the MAC holds it low until it has</text>
<text class="t pn" x="1106" y="196" text-anchor="middle">confirmed it is running at the PHY's speed</text>

<rect x="946" y="226" width="320" height="86" fill="#EFF4F8" stroke="#6E9CB8" rx="4"/>
<text class="t blk2" x="1106" y="248" text-anchor="middle">RX_CLK — from the PHY into the MAC</text>
<text class="t freq" x="1106" y="269" text-anchor="middle">125 / 25 / 2.5 MHz, recovered</text>
<text class="t pn" x="1106" y="287" text-anchor="middle">stretches a pulse when crossing from the free-</text>
<text class="t pn" x="1106" y="302" text-anchor="middle">running clock to the packet clock — never glitches</text>

<rect x="946" y="332" width="320" height="96" fill="#F7FAF0" stroke="#A9BC72" rx="4"/>
<text class="t blk2" x="1106" y="354" text-anchor="middle">CLK_OUT — spare clock to the host</text>
<text class="t pn" x="1106" y="372" text-anchor="middle">Unused on this board, but the most useful pin in the</text>
<text class="t pn" x="1106" y="387" text-anchor="middle">system: set it to the ÷5 recovered clock and the FPGA</text>
<text class="t pn" x="1106" y="402" text-anchor="middle">gets a network-locked 25 MHz reference — one fewer</text>
<text class="t pn" x="1106" y="417" text-anchor="middle">oscillator, and synchronous Ethernet for free.</text>

<rect x="946" y="448" width="320" height="56" fill="#FFF7FB" stroke="#D5AFC6" rx="4"/>
<text class="t blk2" x="1106" y="470" text-anchor="middle">MDC — management clock from the FPGA</text>
<text class="t pn" x="1106" y="488" text-anchor="middle">≤ 25 MHz; turn it off when the bus is idle</text>

<!-- wires -->
<path class="w" d="M254,168 H404" stroke="#61761A" marker-end="url(#ck)"/>
<path class="w" d="M254,296 H330 V180 H404" stroke="#61761A" fill="none" stroke-dasharray="6 4" marker-end="url(#ck)"/>
<text class="t lbl" x="286" y="160">XI / XO</text>
<text class="t lbl" x="286" y="288">alternate</text>
<path class="w" d="M528,226 V248" stroke="#61761A" marker-end="url(#ck)"/>
<path class="w" d="M628,192 H664" stroke="#61761A" marker-end="url(#ck)"/>
<path class="w" d="M628,284 H646 V294 H664" stroke="#61761A" fill="none" marker-end="url(#ck)"/>
<path class="w" d="M628,384 H646 V304 H664" stroke="#2A6C93" fill="none" marker-end="url(#ckr)"/>
<path class="w" d="M528,320 V342" stroke="#2A6C93" marker-end="url(#ckr)"/>
<text class="t lbl" x="330" y="382">from</text>
<text class="t lbl" x="330" y="396">the line</text>
<path class="w" d="M404,384 H360 V440" stroke="#2A6C93" fill="none"/>
<circle cx="360" cy="384" r="3" fill="#2A6C93"/>
<path class="w" d="M946,163 H904 V200 H880" stroke="#2A6C93" fill="none" marker-end="url(#ckr)"/>
<path class="w" d="M880,278 H912 V269 H946" stroke="#2A6C93" fill="none" marker-end="url(#ckr)"/>
<path class="w" d="M880,294 H926 V380 H946" stroke="#61761A" fill="none" marker-end="url(#ck)"/>
<path class="w" d="M946,476 H904 V390 H880" stroke="#8C3A6B" fill="none" marker-end="url(#cko)"/>

<!-- footnote -->
<rect x="34" y="536" width="1232" height="196" fill="#FFFFFF" stroke="#DCE4E9" rx="5"/>
<text class="t blk" x="50" y="562">RGMII source-synchronous timing — the one thing to get right</text>
<text class="t lbl" x="50" y="588">RGMII is source-synchronous and double-data-rate: TXD[3:0] + TX_CTRL travel with GTX_CLK, RXD[3:0] + RX_CTRL travel with RX_CLK. At 125 MHz each half-cycle is 4 ns, so the receiver</text>
<text class="t lbl" x="50" y="606">needs the clock shifted roughly a quarter cycle away from the data edges. There are two legal ways to get that shift, and you must pick exactly one per direction:</text>
<text class="t lbl" x="74" y="632">· <tspan font-weight="600">Board delay</tspan> — leave the PHY in Aligned mode and route the clock trace ≥ 1.5 ns longer than the data traces. Costs layout area on a 27 × 27 mm board. The design guide notes that a custom</text>
<text class="t lbl" x="86" y="648">adapter with controlled impedance and length matching is required for a proper RGMII evaluation.</text>
<text class="t lbl" x="74" y="672">· <tspan font-weight="600">Internal delay</tspan> — put the PHY in Shift mode and dial in 0 – 3.5 ns in 0.25 ns steps. Preferred here: no extra trace length, and the delay is tunable after the board is built.</text>
<text class="t lbl" x="50" y="700">Doing both double-shifts the clock and the link will fail at gigabit while appearing healthy at 100 Mb/s — the classic RGMII symptom. Budget numbers: TskewT −500 to +500 ps at the transmitter,</text>
<text class="t lbl" x="50" y="718">TskewR 1.0 – 2.6 ns at the receiver, and 1.0 – 2.0 ns of internal setup and hold when the PHY's own delay is used.</text>
</svg>
