<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" role="img" aria-label="Focus tolerance stack against depth of focus">
<style>
  .bg{fill:#F6F8FA}
  .t{font-family:'IBM Plex Sans','Inter','Helvetica Neue',Arial,sans-serif;fill:#16202A}
  .m{font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .title{font-size:23px;font-weight:600}
  .sub{font-size:12.5px;fill:#5A6B78}
  .sec{font-size:12.5px;font-weight:600;fill:#41525E}
  .secsub{font-size:10px;fill:#7A8892}
  .blk2{font-size:10.5px;font-weight:600}
  .pn{font-size:9.5px;fill:#61727E}
  .key{font-size:10.5px;fill:#243441}
  .keyb{font-size:10.5px;font-weight:600;fill:#16202A}
  .mono{font-size:10px;font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#243441}
  .monob{font-size:10px;font-weight:600;font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .ax{font-size:9.5px;fill:#7A8892}
</style>
<rect class="bg" x="0" y="0" width="1280" height="790"/>
<text class="t title" x="34.0" y="44.0" text-anchor="start">Focus tolerance stack — why the sensor needs its own board</text>
<text class="t sub" x="34.0" y="66.0" text-anchor="start">The depth of focus for a 3.0 µm circle of confusion at F/2.8 is ± 8.4 µm. Every mechanical contributor between the photodiode and the lens flange is larger than that on its own.</text>
<text class="t sub" x="34.0" y="84.0" text-anchor="start">This is the calculation that decides the mechanical architecture, and it should be done before the housing concept, not after the first prototype is out of focus.</text>
<text class="t sec" x="34.0" y="132.0" text-anchor="start">A · THE CHAIN, FRONT TO BACK</text>
<rect x="34.0" y="150.0" width="560.0" height="300.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<rect x="60.0" y="178.0" width="250.0" height="26.0" rx="4" fill="#FDF6EC" stroke="#C9A570" stroke-width="1.0"/>
<text class="t blk2" x="185.0" y="195.0" text-anchor="middle">lens flange</text>
<line x1="185.0" y1="204.0" x2="185.0" y2="212.0" stroke="#7A8892" stroke-width="1.4" marker-end="url(#mg)"/>
<rect x="60.0" y="212.0" width="250.0" height="26.0" rx="4" fill="#FDF6EC" stroke="#C9A570" stroke-width="1.0"/>
<text class="t blk2" x="185.0" y="229.0" text-anchor="middle">M12 thread engagement</text>
<line x1="185.0" y1="238.0" x2="185.0" y2="246.0" stroke="#7A8892" stroke-width="1.4" marker-end="url(#mg)"/>
<rect x="60.0" y="246.0" width="250.0" height="26.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<text class="t blk2" x="185.0" y="263.0" text-anchor="middle">lens mount casting</text>
<line x1="185.0" y1="272.0" x2="185.0" y2="280.0" stroke="#7A8892" stroke-width="1.4" marker-end="url(#mg)"/>
<rect x="60.0" y="280.0" width="250.0" height="26.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<text class="t blk2" x="185.0" y="297.0" text-anchor="middle">standoff / boss</text>
<line x1="185.0" y1="306.0" x2="185.0" y2="314.0" stroke="#7A8892" stroke-width="1.4" marker-end="url(#mg)"/>
<rect x="60.0" y="314.0" width="250.0" height="26.0" rx="4" fill="#EFF4F8" stroke="#6E9CB8" stroke-width="1.0"/>
<text class="t blk2" x="185.0" y="331.0" text-anchor="middle">sensor PCB thickness</text>
<line x1="185.0" y1="340.0" x2="185.0" y2="348.0" stroke="#7A8892" stroke-width="1.4" marker-end="url(#mg)"/>
<rect x="60.0" y="348.0" width="250.0" height="26.0" rx="4" fill="#EFF4F8" stroke="#6E9CB8" stroke-width="1.0"/>
<text class="t blk2" x="185.0" y="365.0" text-anchor="middle">solder joint after reflow</text>
<line x1="185.0" y1="374.0" x2="185.0" y2="382.0" stroke="#7A8892" stroke-width="1.4" marker-end="url(#mg)"/>
<rect x="60.0" y="382.0" width="250.0" height="26.0" rx="4" fill="#EFF4F8" stroke="#6E9CB8" stroke-width="1.0"/>
<text class="t blk2" x="185.0" y="399.0" text-anchor="middle">package datum to die</text>
<line x1="185.0" y1="408.0" x2="185.0" y2="416.0" stroke="#7A8892" stroke-width="1.4" marker-end="url(#mg)"/>
<rect x="60.0" y="416.0" width="250.0" height="26.0" rx="4" fill="#EFF8F3" stroke="#84B9A2" stroke-width="1.0"/>
<text class="t blk2" x="185.0" y="433.0" text-anchor="middle">photodiode plane</text>
<line x1="340.0" y1="178.0" x2="340.0" y2="442.0" stroke="#A6402F" stroke-width="2.4"/>
<line x1="332.0" y1="178.0" x2="348.0" y2="178.0" stroke="#A6402F" stroke-width="2.4"/>
<line x1="332.0" y1="442.0" x2="348.0" y2="442.0" stroke="#A6402F" stroke-width="2.4"/>
<g transform="translate(366,314) rotate(-90)"><text class="t blk2" x="0.0" y="0.0" text-anchor="middle" fill="#A6402F">everything in this chain is the focus error</text></g>
<text class="t sec" x="640.0" y="132.0" text-anchor="start">B · CONTRIBUTORS AGAINST THE BUDGET</text>
<text class="t secsub" x="640.0" y="147.0" text-anchor="start">typical half-tolerances, µm</text>
<rect x="640.0" y="162.0" width="606.0" height="300.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<text class="t key" x="862.0" y="205.0" text-anchor="end">Die to package datum</text>
<rect x="872.0" y="194.0" width="95.0" height="16.0" rx="2" fill="#B5742A" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="975.0" y="206.0" text-anchor="start">± 25</text>
<text class="t key" x="862.0" y="235.0" text-anchor="end">Placement + reflow standoff</text>
<rect x="872.0" y="224.0" width="152.0" height="16.0" rx="2" fill="#B5742A" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="1032.0" y="236.0" text-anchor="start">± 40</text>
<text class="t key" x="862.0" y="265.0" text-anchor="end">PCB thickness, 10-layer</text>
<rect x="872.0" y="254.0" width="190.0" height="16.0" rx="2" fill="#B5742A" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="1070.0" y="266.0" text-anchor="start">± 50</text>
<text class="t key" x="862.0" y="295.0" text-anchor="end">Standoff / boss machining</text>
<rect x="872.0" y="284.0" width="95.0" height="16.0" rx="2" fill="#B5742A" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="975.0" y="296.0" text-anchor="start">± 25</text>
<text class="t key" x="862.0" y="325.0" text-anchor="end">Mount flatness and squareness</text>
<rect x="872.0" y="314.0" width="76.0" height="16.0" rx="2" fill="#B5742A" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="956.0" y="326.0" text-anchor="start">± 20</text>
<text class="t key" x="862.0" y="355.0" text-anchor="end">M12 thread axial play</text>
<rect x="872.0" y="344.0" width="114.0" height="16.0" rx="2" fill="#B5742A" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="994.0" y="356.0" text-anchor="start">± 30</text>
<line x1="656.0" y1="382.0" x2="1230.0" y2="382.0" stroke="#C3D0D8" stroke-width="1.0"/>
<text class="t keyb" x="862.0" y="399.0" text-anchor="end">RSS of the above</text>
<rect x="872.0" y="388.0" width="311.6" height="16.0" rx="2" fill="#A6402F" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="1175.6" y="400.0" text-anchor="end" fill="#FFFFFF">± 82</text>
<text class="t keyb" x="862.0" y="429.0" text-anchor="end">Worst case, arithmetic</text>
<rect x="872.0" y="418.0" width="358.0" height="16.0" rx="2" fill="#A6402F" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="1222.0" y="430.0" text-anchor="end" fill="#FFFFFF">± 190</text>
<text class="t keyb" x="862.0" y="459.0" text-anchor="end" fill="#1E7A5C">Depth of focus, F/2.8</text>
<rect x="872.0" y="448.0" width="31.9" height="16.0" rx="2" fill="#1E7A5C" stroke="none" stroke-width="1.0"/>
<text class="t blk2" x="911.9" y="460.0" text-anchor="start" fill="#1E7A5C">± 8.4</text>
<text class="t pn" x="656.0" y="498.0" text-anchor="start">The RSS stack is roughly ten times the budget. No tightening of individual</text>
<text class="t pn" x="656.0" y="512.0" text-anchor="start">tolerances closes a 10× gap — the architecture has to absorb it instead.</text>
<text class="t keyb" x="34.0" y="544.0" text-anchor="start">Therefore: a separate sensor board with an adjustable focus path.</text>
<text class="t key" x="34.0" y="557.0" text-anchor="start">Either a threaded M12 lens focused and locked at test, or</text>
<text class="t key" x="34.0" y="569.0" text-anchor="start">active alignment of the sensor board against a live MTF</text>
<text class="t key" x="34.0" y="581.0" text-anchor="start">measurement. Both need the sensor to move relative to the</text>
<text class="t key" x="34.0" y="593.0" text-anchor="start">mount, which is exactly why the floorplan puts it on its</text>
<text class="t key" x="34.0" y="605.0" text-anchor="start">own board behind a flex.</text>
<text class="t keyb" x="34.0" y="627.0" text-anchor="start">Tilt has its own budget, and it is smaller than it looks.</text>
<text class="t key" x="34.0" y="640.0" text-anchor="start">0.05° across the 6.79 mm diagonal is 5.9 µm at the corner</text>
<text class="t key" x="34.0" y="652.0" text-anchor="start">— most of the focus budget spent on tilt alone. Specify</text>
<text class="t key" x="34.0" y="664.0" text-anchor="start">mount-face-to-sensor-plane parallelism, and measure it</text>
<text class="t key" x="34.0" y="676.0" text-anchor="start">with a four-corner MTF target, not a centre-only one.</text>
<text class="t keyb" x="34.0" y="698.0" text-anchor="start">Lock the focus, and prove the lock survives.</text>
<text class="t key" x="34.0" y="711.0" text-anchor="start">Thread-locking compound, a set screw, or a glued lens</text>
<text class="t key" x="34.0" y="723.0" text-anchor="start">barrel. Then run the vibration profile and re-measure MTF</text>
<text class="t key" x="34.0" y="735.0" text-anchor="start">— a focus lock that passes at room temperature and fails</text>
<text class="t key" x="34.0" y="747.0" text-anchor="start">at IEC 60068-2-6 is a field return, not a test failure.</text>
<text class="t keyb" x="500.0" y="544.0" text-anchor="start">Depth of focus scales with F-number, and that is the only free variable.</text>
<text class="t key" x="500.0" y="557.0" text-anchor="start">F/4 doubles the budget to ± 12 µm and costs 14 points of</text>
<text class="t key" x="500.0" y="569.0" text-anchor="start">MTF at Nyquist. F/5.6 gives ± 16.8 µm and costs 30 points.</text>
<text class="t key" x="500.0" y="581.0" text-anchor="start">It is a real trade and it should be made deliberately with</text>
<text class="t key" x="500.0" y="593.0" text-anchor="start">the application, not discovered during assembly.</text>
<text class="t keyb" x="500.0" y="615.0" text-anchor="start">Run the stack again for temperature.</text>
<text class="t key" x="500.0" y="628.0" text-anchor="start">Aluminium expands at roughly 23 ppm/°C. Over a 60 °C range</text>
<text class="t key" x="500.0" y="640.0" text-anchor="start">and a 10 mm flange distance that is 14 µm of defocus —</text>
<text class="t key" x="500.0" y="652.0" text-anchor="start">larger than the entire F/2.8 budget. An athermalised mount</text>
<text class="t key" x="500.0" y="664.0" text-anchor="start">or a matched-CTE spacer is not an optional refinement.</text>
<text class="t keyb" x="500.0" y="686.0" text-anchor="start">The datum is the optical centre, not the package outline.</text>
<text class="t key" x="500.0" y="699.0" text-anchor="start">Confirm it on the current AR0234CS mechanical drawing. The</text>
<text class="t key" x="500.0" y="711.0" text-anchor="start">array is not necessarily centred in the package, and</text>
<text class="t key" x="500.0" y="723.0" text-anchor="start">machining the mount to the package edge builds in a</text>
<text class="t key" x="500.0" y="735.0" text-anchor="start">decentration error that looks like lens astigmatism.</text>
<defs><marker id="mg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A8892"/></marker><marker id="mr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#A6402F"/></marker><marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2A6C93"/></marker><marker id="mgr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1E7A5C"/></marker><marker id="ma" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B5742A"/></marker></defs>
</svg>