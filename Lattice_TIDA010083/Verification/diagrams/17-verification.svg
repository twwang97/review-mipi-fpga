<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="1280" height="830" role="img" aria-label="Bring-up ladder, production test flow, and calibration order">
<style>
  .bg{fill:#F6F8FA}
  .t{font-family:'IBM Plex Sans','Inter','Helvetica Neue',Arial,sans-serif;fill:#16202A}
  .m{font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .title{font-size:23px;font-weight:600}
  .sub{font-size:12.5px;fill:#5A6B78}
  .sec{font-size:12.5px;font-weight:600;fill:#41525E}
  .secsub{font-size:10px;fill:#7A8892}
  .blk2{font-size:10.5px;font-weight:600}
  .pn{font-size:9.5px;fill:#61727E}
  .key{font-size:10.5px;fill:#243441}
  .keyb{font-size:10.5px;font-weight:600;fill:#16202A}
  .mono{font-size:10px;font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#243441}
  .monob{font-size:10px;font-weight:600;font-family:'IBM Plex Mono','Roboto Mono',Menlo,Consolas,monospace;fill:#16202A}
  .ax{font-size:9.5px;fill:#7A8892}
</style>
<rect class="bg" x="0" y="0" width="1280" height="830"/>
<text class="t title" x="34.0" y="44.0" text-anchor="start">Bring-up, production test and calibration</text>
<text class="t sub" x="34.0" y="66.0" text-anchor="start">Eight gates, in order. Each one has a pass criterion that can be checked with the instrument named, and nothing downstream is attempted until it passes.</text>
<text class="t sub" x="34.0" y="84.0" text-anchor="start">The order is not arbitrary: it follows the dependency graph, so a failure at any gate has at most a handful of possible causes rather than the whole board.</text>
<text class="t sec" x="34.0" y="132.0" text-anchor="start">A · BRING-UP LADDER</text>
<text class="t secsub" x="34.0" y="147.0" text-anchor="start">do not skip ahead — each gate exists to bound the search space of the next failure</text>
<rect x="34.0" y="166.0" width="700.0" height="42.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<circle cx="58" cy="187" r="12" fill="#2A6C93"/>
<text class="t" x="58.0" y="191.0" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
<text class="t keyb" x="80.0" y="184.0" text-anchor="start">Bare board</text>
<text class="t pn" x="80.0" y="199.0" text-anchor="start">TDR coupon and cross-section</text>
<text class="t key" x="304.0" y="184.0" text-anchor="start">Impedance within ±10 %, microvias filled, dimple ≤ 25</text>
<text class="t key" x="304.0" y="197.0" text-anchor="start">µm, no stacked vias where staggered was specified.</text>
<rect x="34.0" y="215.0" width="700.0" height="42.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<circle cx="58" cy="236" r="12" fill="#2A6C93"/>
<text class="t" x="58.0" y="240.0" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
<text class="t keyb" x="80.0" y="233.0" text-anchor="start">Power, no FPGA</text>
<text class="t pn" x="80.0" y="248.0" text-anchor="start">Bench supply into the 5 V node</text>
<text class="t key" x="304.0" y="233.0" text-anchor="start">All four rails within 2 %, no rail above its sequence</text>
<text class="t key" x="304.0" y="246.0" text-anchor="start">partner, total quiescent within 50 mA of prediction.</text>
<rect x="34.0" y="264.0" width="700.0" height="55.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<circle cx="58" cy="291" r="12" fill="#2A6C93"/>
<text class="t" x="58.0" y="295.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
<text class="t keyb" x="80.0" y="282.0" text-anchor="start">Configuration</text>
<text class="t pn" x="80.0" y="297.0" text-anchor="start">JTAG, then SPI flash</text>
<text class="t key" x="304.0" y="282.0" text-anchor="start">Radiant connects, IDCODE correct, then a flash boot</text>
<text class="t key" x="304.0" y="295.0" text-anchor="start">completes inside the 200 ms PHY window measured from</text>
<text class="t key" x="304.0" y="308.0" text-anchor="start">rail-up.</text>
<rect x="34.0" y="326.0" width="700.0" height="42.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<circle cx="58" cy="347" r="12" fill="#2A6C93"/>
<text class="t" x="58.0" y="351.0" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
<text class="t keyb" x="80.0" y="344.0" text-anchor="start">PHY management</text>
<text class="t pn" x="80.0" y="359.0" text-anchor="start">MDIO reads of PHYIDR1/2</text>
<text class="t key" x="304.0" y="344.0" text-anchor="start">Correct ID at the strapped address. INT/PWDN confirmed</text>
<text class="t key" x="304.0" y="357.0" text-anchor="start">high and never driven by the FPGA.</text>
<rect x="34.0" y="375.0" width="700.0" height="55.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<circle cx="58" cy="402" r="12" fill="#2A6C93"/>
<text class="t" x="58.0" y="406.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text>
<text class="t keyb" x="80.0" y="393.0" text-anchor="start">Link, no MAC</text>
<text class="t pn" x="80.0" y="408.0" text-anchor="start">BISCR 0x0016 = 0x0020 loopback</text>
<text class="t key" x="304.0" y="393.0" text-anchor="start">1 Gb/s link on 20 cm and on 150 m of CAT6, zero frame</text>
<text class="t key" x="304.0" y="406.0" text-anchor="start">errors — exactly the test TI used to validate the TIDA</text>
<text class="t key" x="304.0" y="419.0" text-anchor="start">board.</text>
<rect x="34.0" y="437.0" width="700.0" height="55.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<circle cx="58" cy="464" r="12" fill="#2A6C93"/>
<text class="t" x="58.0" y="468.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>
<text class="t keyb" x="80.0" y="455.0" text-anchor="start">DDR3L</text>
<text class="t pn" x="80.0" y="470.0" text-anchor="start">Built-in memtest + training report</text>
<text class="t key" x="304.0" y="455.0" text-anchor="start">Training window ≥ 40 % of the bit period, walking-ones</text>
<text class="t key" x="304.0" y="468.0" text-anchor="start">and address-aliasing tests clean at temperature</text>
<text class="t key" x="304.0" y="481.0" text-anchor="start">extremes.</text>
<rect x="34.0" y="499.0" width="700.0" height="55.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<circle cx="58" cy="526" r="12" fill="#2A6C93"/>
<text class="t" x="58.0" y="530.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">7</text>
<text class="t keyb" x="80.0" y="517.0" text-anchor="start">Sensor</text>
<text class="t pn" x="80.0" y="532.0" text-anchor="start">I²C at 1.8 V, then D-PHY</text>
<text class="t key" x="304.0" y="517.0" text-anchor="start">Chip version register reads correctly, then a</text>
<text class="t key" x="304.0" y="530.0" text-anchor="start">known-pattern frame arrives with zero ECC and zero CRC</text>
<text class="t key" x="304.0" y="543.0" text-anchor="start">errors over 10⁶ frames.</text>
<rect x="34.0" y="561.0" width="700.0" height="42.0" rx="4" fill="#FFFFFF" stroke="#C3D0D8" stroke-width="1.0"/>
<circle cx="58" cy="582" r="12" fill="#2A6C93"/>
<text class="t" x="58.0" y="586.0" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">8</text>
<text class="t keyb" x="80.0" y="579.0" text-anchor="start">End to end</text>
<text class="t pn" x="80.0" y="594.0" text-anchor="start">GigE Vision client on a PC</text>
<text class="t key" x="304.0" y="579.0" text-anchor="start">Discovery, register access, and a streamed frame that</text>
<text class="t key" x="304.0" y="592.0" text-anchor="start">matches a reference image bit-for-bit.</text>
<text class="t keyb" x="34.0" y="632.0" text-anchor="start" fill="#A6402F">Blocker carried forward from the RTL.</text>
<text class="t key" x="34.0" y="648.0" text-anchor="start">The FPGA README records an open defect: isp_eof asserts twice for three input frames, so the final</text>
<text class="t key" x="34.0" y="661.0" text-anchor="start">frame's descriptor is never produced. Gate 8 cannot pass until it is fixed. It is a waveform problem</text>
<text class="t key" x="34.0" y="674.0" text-anchor="start">in isp_framer or the isp_bin2x2 bypass, and the testbench reproduces it deterministically.</text>
<text class="t sec" x="772.0" y="132.0" text-anchor="start">B · PRODUCTION TEST, PER UNIT</text>
<text class="t keyb" x="772.0" y="158.0" text-anchor="start">1 · In-circuit, boundary scan.</text>
<text class="t key" x="772.0" y="171.0" text-anchor="start">JTAG chain integrity, FPGA-to-DDR3L and FPGA-to-PHY net</text>
<text class="t key" x="772.0" y="183.0" text-anchor="start">continuity. Catches opens and shorts before anything is</text>
<text class="t key" x="772.0" y="195.0" text-anchor="start">powered hard.</text>
<text class="t keyb" x="772.0" y="217.0" text-anchor="start">2 · Rail and current signature.</text>
<text class="t key" x="772.0" y="230.0" text-anchor="start">Four rails to tolerance, total current compared against a</text>
<text class="t key" x="772.0" y="242.0" text-anchor="start">golden unit ± 10 %. A shorted decoupling capacitor shows up</text>
<text class="t key" x="772.0" y="254.0" text-anchor="start">here and nowhere else.</text>
<text class="t keyb" x="772.0" y="276.0" text-anchor="start">3 · Link and throughput.</text>
<text class="t key" x="772.0" y="289.0" text-anchor="start">Reverse loopback, then a 60-second iperf-equivalent at line</text>
<text class="t key" x="772.0" y="301.0" text-anchor="start">rate with a frame-error counter.</text>
<text class="t keyb" x="772.0" y="323.0" text-anchor="start">4 · Sensor functional.</text>
<text class="t key" x="772.0" y="336.0" text-anchor="start">Dark frame and a flat illuminated frame at a fixed exposure.</text>
<text class="t key" x="772.0" y="348.0" text-anchor="start">Yields the defect map used in calibration.</text>
<text class="t keyb" x="772.0" y="370.0" text-anchor="start">5 · Optical.</text>
<text class="t key" x="772.0" y="383.0" text-anchor="start">Four-corner MTF against a slanted-edge target, then focus</text>
<text class="t key" x="772.0" y="395.0" text-anchor="start">lock. Record the measured MTF with the serial number.</text>
<text class="t keyb" x="772.0" y="417.0" text-anchor="start">6 · Burn-in, 4 h at 70 °C.</text>
<text class="t key" x="772.0" y="430.0" text-anchor="start">Streaming continuously, counting errors. Infant mortality in</text>
<text class="t key" x="772.0" y="442.0" text-anchor="start">filled microvias appears here or in the field; here is</text>
<text class="t key" x="772.0" y="454.0" text-anchor="start">cheaper.</text>
<text class="t sec" x="772.0" y="488.0" text-anchor="start">C · CALIBRATION ORDER</text>
<text class="t secsub" x="772.0" y="503.0" text-anchor="start">each step depends on the one before it</text>
<circle cx="781" cy="520" r="9" fill="#1E7A5C"/>
<text class="t" x="781.0" y="523.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">1</text>
<text class="t keyb" x="798.0" y="524.0" text-anchor="start">Defect pixel map</text>
<text class="t key" x="798.0" y="537.0" text-anchor="start">Dark and flat frames, threshold at 5σ. Store in flash; the</text>
<text class="t key" x="798.0" y="549.0" text-anchor="start">ISP's isp_defect consumes it.</text>
<line x1="781.0" y1="530.0" x2="781.0" y2="563.0" stroke="#1E7A5C" stroke-width="1.6"/>
<circle cx="781" cy="569" r="9" fill="#1E7A5C"/>
<text class="t" x="781.0" y="572.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">2</text>
<text class="t keyb" x="798.0" y="573.0" text-anchor="start">Black level</text>
<text class="t key" x="798.0" y="586.0" text-anchor="start">Per-channel offset from optically black rows at each gain</text>
<text class="t key" x="798.0" y="598.0" text-anchor="start">setting. Must run after DPC or hot pixels bias the offset.</text>
<line x1="781.0" y1="579.0" x2="781.0" y2="612.0" stroke="#1E7A5C" stroke-width="1.6"/>
<circle cx="781" cy="618" r="9" fill="#1E7A5C"/>
<text class="t" x="781.0" y="621.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">3</text>
<text class="t keyb" x="798.0" y="622.0" text-anchor="start">Flat field and lens shading</text>
<text class="t key" x="798.0" y="635.0" text-anchor="start">Uniform illuminated target, per-unit gain surface. Must</text>
<text class="t key" x="798.0" y="647.0" text-anchor="start">run after black level or the correction bakes in the</text>
<text class="t key" x="798.0" y="659.0" text-anchor="start">offset.</text>
<line x1="781.0" y1="628.0" x2="781.0" y2="673.0" stroke="#1E7A5C" stroke-width="1.6"/>
<circle cx="781" cy="679" r="9" fill="#1E7A5C"/>
<text class="t" x="781.0" y="682.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">4</text>
<text class="t keyb" x="798.0" y="683.0" text-anchor="start">Timestamp and trigger latency</text>
<text class="t key" x="798.0" y="696.0" text-anchor="start">Measure TRIGGER-to-FLASH against the network clock and</text>
<text class="t key" x="798.0" y="708.0" text-anchor="start">store the constant. This is what makes multi-camera sync</text>
<text class="t key" x="798.0" y="720.0" text-anchor="start">work.</text>
<defs><marker id="mg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A8892"/></marker><marker id="mr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#A6402F"/></marker><marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2A6C93"/></marker><marker id="mgr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1E7A5C"/></marker><marker id="ma" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B5742A"/></marker></defs>
</svg>